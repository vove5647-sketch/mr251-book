<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.R251 | تمرد بلا حدود</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #eee;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 28px 16px;
      border-bottom: 1px solid #9c7b36;
    }

    .brand {
      color: #d5b36a;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 25px;
      margin: 20px 0 8px;
    }

    .author {
      color: #c6a45d;
      margin-bottom: 22px;
    }

    .intro {
      max-width: 650px;
      margin: 0 auto;
      padding: 0 18px 24px;
      line-height: 1.9;
      color: #c8c8c8;
    }

    button {
      background: #c6a45d;
      color: #111;
      border: 0;
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e2c783;
    }

    #reader {
      display: none;
      margin: 25px auto;
      width: 94%;
      max-width: 1000px;
    }

    iframe {
      width: 100%;
      height: 75vh;
      min-height: 450px;
      border: 1px solid #9c7b36;
      border-radius: 8px;
      background: #fff;
    }

    .counter {
      margin: 20px;
      color: #d5b36a;
    }

    footer {
      padding: 25px 12px;
      color: #777;
      border-top: 1px solid #292929;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">M.R251</div>
    <h1>تمرد بلا حدود</h1>
    <div class="author">بقلم محمد عبد الحميد</div>
    <p class="intro">
      ليست كل القيود مرئية، وليست كل الثورات صاخبة.
      أحيانًا يبدأ التمرد بسؤالٍ تجرأت على طرحه.
    </p>
    <button onclick="openBook()">قراءة الكتاب</button>
    <div class="counter">
      عدد القراءات المسجلة: <span id="count">—</span>
    </div>
  </header>

  <main id="reader">
    <iframe id="pdf" title="قراءة كتاب تمرد بلا حدود"
      src="about:blank" allowfullscreen></iframe>
  </main>

  <footer>
    © 2026 محمد عبد الحميد | M.R251<br>
    جميع الحقوق محفوظة
  </footer>

  <script>
    const PDF_FILE_ID = '1BN-r8batHnMfCbQ4FyEI6vAOCF9sjyfM';

    function openBook() {
      document.getElementById('reader').style.display = 'block';
      document.getElementById('pdf').src =
        'https://drive.google.com/file/d/' +
        PDF_FILE_ID + '/preview';

      document.getElementById('reader').scrollIntoView({
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
