
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="اقرأ كتاب تمرد بلا حدود للكاتب محمد عبد الحميد M.R251.">
  <meta name="theme-color" content="#0b0b0b">

  <title>تمرد بلا حدود | محمد عبد الحميد M.R251</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #eee;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 28px 16px;
      border-bottom: 1px solid #9c7b36;
    }

    .brand {
      color: #d5b36a;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 25px;
      margin: 20px 0 8px;
    }

    .author {
      color: #c6a45d;
      margin-bottom: 22px;
    }

    .intro {
      max-width: 650px;
      margin: 0 auto;
      padding: 0 18px 24px;
      line-height: 1.9;
      color: #c8c8c8;
    }

    button {
      background: #c6a45d;
      color: #111;
      border: 0;
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #e2c783; }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    #reader {
      display: none;
      margin: 25px auto;
      width: 94%;
      max-width: 1000px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 75vh;
      min-height: 450px;
      border: 1px solid #9c7b36;
      border-radius: 8px;
      background: #fff;
    }

    .counter {
      margin: 20px;
      color: #d5b36a;
    }

    #status {
      min-height: 20px;
      margin: 10px;
      color: #aaa;
      font-size: 13px;
    }

    footer {
      padding: 25px 12px;
      color: #777;
      border-top: 1px solid #292929;
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header { padding: 24px 12px; }
      h1 { font-size: 23px; }
      iframe { height: 70vh; min-height: 400px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">M.R251</div>
    <h1>تمرد بلا حدود</h1>
    <div class="author">بقلم محمد عبد الحميد</div>

    <p class="intro">
      ليست كل القيود مرئية، وليست كل الثورات صاخبة.
      أحيانًا يبدأ التمرد بسؤالٍ تجرأت على طرحه.
    </p>

    <button id="readButton" type="button">
      قراءة الكتاب
    </button>

    <div class="counter">
      عدد مرات فتح الكتاب:
      <strong id="count">جارٍ التحميل...</strong>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </header>

  <main id="reader">
    <iframe
      id="pdf"
      title="قراءة كتاب تمرد بلا حدود"
      src="about:blank"
      allowfullscreen>
    </iframe>
  </main>

  <footer>
    © 2026 محمد عبد الحميد | M.R251<br>
    جميع الحقوق محفوظة
  </footer>

  <script>
    "use strict";

    const PDF_FILE_ID =
      "1BN-r8batHnMfCbQ4FyEI6vAOCF9sjyfM";

    const COUNTER_URL =
      "https://mr251-book-counter.vove5647.workers.dev";

    const countElement = document.getElementById("count");
    const statusElement = document.getElementById("status");
    const readButton = document.getElementById("readButton");
    const readerElement = document.getElementById("reader");
    const pdfElement = document.getElementById("pdf");

    let isOpening = false;
    let updateSequence = 0;

    function showCount(value) {
      const count = Number(value);

      if (Number.isSafeInteger(count) && count >= 0) {
        countElement.textContent = count.toLocaleString("ar-EG");
      }
    }

    async function loadCount() {
      const sequence = ++updateSequence;

      try {
        const response = await fetch(
          COUNTER_URL + "/count",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Counter request failed");
        }

        const data = await response.json();

        if (!data.success || !Number.isSafeInteger(Number(data.visits))) {
          throw new Error("Invalid counter response");
        }

        if (sequence === updateSequence) {
          showCount(data.visits);
          statusElement.textContent = "";
        }
      } catch (error) {
        if (sequence === updateSequence) {
          countElement.textContent = "غير متاح";
          statusElement.textContent =
            "تعذر تحميل العداد. يمكنك قراءة الكتاب.";
        }
      }
    }

    async function openBook() {
      if (isOpening) return;

      isOpening = true;
      readButton.disabled = true;
      statusElement.textContent = "جارٍ تسجيل الزيارة...";

      readerElement.style.display = "block";

      pdfElement.src =
        "https://drive.google.com/file/d/" +
        PDF_FILE_ID + "/preview";

      readerElement.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      const sequence = ++updateSequence;

      try {
        const response = await fetch(
          COUNTER_URL + "/visit",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Visit request failed");
        }

        const data = await response.json();

        if (
          data.success !== true ||
          !Number.isSafeInteger(Number(data.visits)) ||
          Number(data.visits) < 1
        ) {
          throw new Error("Invalid visit response");
        }

        if (sequence === updateSequence) {
          showCount(data.visits);
          statusElement.textContent =
            "تم تسجيل فتح الكتاب بنجاح.";
        }
      } catch (error) {
        if (sequence === updateSequence) {
          statusElement.textContent =
            "الكتاب مفتوح، لكن تعذر تحديث العداد.";
        }
      } finally {
        isOpening = false;
        readButton.disabled = false;
      }
    }

    readButton.addEventListener("click", openBook);

    loadCount();
  </script>
</body>
</html>
